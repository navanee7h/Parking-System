<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parking Availability</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main style="max-width:1100px">
  <h1 id="lot-name">Parking availability</h1>
  <p class="sub">Live from CCTV · refreshes every 5 seconds</p>
  <div class="card stats">
    <div class="stat"><span class="sub">Free</span><b id="free" style="color:var(--free)">–</b></div>
    <div class="stat"><span class="sub">Occupied</span><b id="occ">–</b></div>
    <div class="stat"><span class="sub">Nearest free from <span id="from-name"></span></span><b id="nearest">–</b></div>
  </div>
  <div class="card">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="map-wrap"><svg id="map" role="img" aria-label="Map of free and occupied slots"></svg></div>
    <div class="legend">
      <span><i style="background:var(--free)"></i>Free</span>
      <span><i style="background:var(--occupied)"></i>Occupied</span>
      <span><i style="background:var(--mine)"></i>Nearest free slot</span>
    </div>
  </div>
</main>
<div id="load-error" class="warn hidden" role="alert"></div>
<script>
  // shows a message instead of a blank page if the scripts fail to load
  function showLoadError(msg) {
    var el = document.getElementById("load-error");
    el.textContent = "The map could not load: " + msg + " — try a hard refresh (Ctrl+Shift+R).";
    el.classList.remove("hidden");
  }
  window.addEventListener("error", function (e) { showLoadError(e.message || "script error"); });
  window.addEventListener("unhandledrejection", function (e) { showLoadError(String(e.reason && e.reason.message || e.reason)); });
</script>
<script type="module">
  import { renderFloor } from "/static/map.js?v=2";
  const lot = await (await fetch("/api/lot")).json();
  const params = new URLSearchParams(location.search);
  const from = params.get("from") || (lot.points.find(p => p.kind === "gate") || lot.points[0]).id;
  const fromPoint = lot.points.find(p => p.id === from);
  let floor = params.get("floor") || fromPoint.floor;
  document.getElementById("lot-name").textContent = lot.name;
  document.getElementById("from-name").textContent = fromPoint.name;
  let last = null;

  function tabs(s) {
    document.getElementById("tabs").innerHTML = lot.floors.map(f =>
      `<button role="tab" aria-selected="${f.id === floor}" data-f="${f.id}">${f.name}
        <small>· ${s.floors[f.id]?.free ?? 0} free</small></button>`).join("");
    document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { floor = b.dataset.f; draw(); });
  }

  async function draw() {
    if (!last) return;
    const { s, route } = last;
    tabs(s);
    const status = Object.fromEntries(s.slots.map(x => [x.slot_id, x.occupied]));
    const leg = route?.legs?.find(l => l.floor === floor);
    await renderFloor(document.getElementById("map"), lot, floor, status, {
      from: fromPoint.floor === floor ? from : null,
      highlight: route?.floor === floor ? route.slot : null,
      path: leg?.path, zoom: "floor" });
  }

  async function tick() {
    const s = await (await fetch("/api/slots")).json();
    document.getElementById("free").textContent = s.free;
    document.getElementById("occ").textContent = s.occupied;
    const r = await fetch(`/api/nearest-free?from=${encodeURIComponent(from)}`);
    const route = r.ok ? await r.json() : null;
    const fname = route && lot.floors.find(f => f.id === route.floor).name;
    document.getElementById("nearest").textContent = route ? `${route.slot}` : "Full";
    document.getElementById("nearest").title = fname || "";
    last = { s, route };
    await draw();
  }
  tick(); setInterval(tick, 5000);
</script>
</body>
</html>
