<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find My Car</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  
  <h1>Find my car</h1>
  <p class="sub" id="lot-name"></p>

  <div class="card">
    <label for="from">You are at</label>
    <select id="from"></select>
    <label class="check"><input type="checkbox" id="lifts-only"> Use lifts only (wheelchair, pram, luggage)</label>
  </div>

  <div class="card">
    <label for="plate">Number plate</label>
    <input id="plate" autocomplete="off" autocapitalize="characters" spellcheck="false"
           placeholder="e.g. KA05MH1234" maxlength="16" inputmode="text">
    <div class="hint">Don't remember all of it? Type the part you know, e.g. <b>1234</b> or <b>KA05</b>.</div>
    <ul class="suggestions" id="suggestions" aria-live="polite"></ul>
  </div>

  <div class="card" id="preview">
    <div class="map-head" style="margin-top:0"><h3 id="preview-title">Map</h3></div>
    <div class="map-wrap"><svg id="preview-map" role="img" aria-label="Map of the floor you are on"></svg></div>
    <div class="legend">
      <span><i style="background:var(--free)"></i>Free</span>
      <span><i style="background:var(--occupied)"></i>Occupied</span>
      <span><i style="background:var(--accent)"></i>You</span>
    </div>
  </div>

  <div class="card hidden" id="result">
    <h2 style="margin:0 0 4px;font-size:1.2rem" id="title"></h2>
    <div class="sub" style="margin:0" id="summary"></div>
    <div class="warn hidden" id="partial-warn"></div>
    <div id="maps"></div>
    <div class="legend">
      <span><i style="background:var(--mine)"></i>Your car</span>
      <span><i style="background:var(--free)"></i>Free</span>
      <span><i style="background:var(--occupied)"></i>Occupied</span>
      <span><i style="background:var(--accent)"></i>You</span>
      <span><i style="background:var(--path)"></i>Route</span>
    </div>
    <h3 style="margin:16px 0 0;font-size:1rem">Directions</h3>
    <ol class="steps" id="steps"></ol>
  </div>
</main>
<div id="load-error" class="warn hidden" role="alert"></div>
<script>
  // shows a message instead of a blank page if the scripts fail to load
  function showLoadError(msg) {
    var el = document.getElementById("load-error");
    el.textContent = "The map could not load: " + msg + " — try a hard refresh (Ctrl+Shift+R).";
    el.classList.remove("hidden");
  }
  window.addEventListener("error", function (e) { showLoadError(e.message || "script error"); });
  window.addEventListener("unhandledrejection", function (e) { showLoadError(String(e.reason && e.reason.message || e.reason)); });
</script>
<script type="module" src="/static/find.js?v=2" onerror="showLoadError('find.js did not load')"></script>
</body>
</html>
